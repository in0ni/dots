# Sony headset (AC:80:0A:4F:49:29) — ported from main.lua.d/51-device-priority.lua

# Prefer A2DP (AAC if offered) when the headset connects. Per-device only;
# other Bluetooth devices keep the default codec/profile selection.
# A profile remembered from a manual switch still takes precedence.
device.profile.priority.rules = [
  {
    matches = [ { device.name = "bluez_card.AC_80_0A_4F_49_29" } ]
    actions = {
      update-props = {
        priorities = [ a2dp-sink-aac a2dp-sink ]
      }
    }
  }
]

monitor.bluez.rules = [
  # Connect the media and call profiles automatically
  {
    matches = [ { device.name = "bluez_card.AC_80_0A_4F_49_29" } ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink hfp_hf hsp_hs ]
      }
    }
  }
  # Make the headset the default output whenever it is connected
  {
    matches = [ { node.name = "~bluez_output.AC_80_0A_4F_49_29.*" } ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
      }
    }
  }
]
