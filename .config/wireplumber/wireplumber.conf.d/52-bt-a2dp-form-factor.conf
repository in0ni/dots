# Bluetooth headsets report device.form-factor = "headset" in every profile,
# so waybar's pulseaudio module always shows the headset icon. Report A2DP
# (music, no mic) sinks as headphones; HFP sinks keep "headset".
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name          = "~bluez_output.*"
        api.bluez5.profile = "a2dp-sink"
      }
    ]
    actions = {
      update-props = {
        device.form-factor = "headphone"
      }
    }
  }
]
