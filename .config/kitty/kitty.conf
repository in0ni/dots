allow_remote_control          yes
listen_on                     unix:@kitty
close_on_child_death          yes
# kitty >= 0.49 persists window-state to ~/.cache/kitty/main.json. Under a
# tiling WM a tiled window fills the monitor, so kitty records "maximized"
# and then asks Hyprland to maximize every new window. Remembering a size
# is meaningless when the WM tiles anyway.
remember_window_size          no
enable_audio_bell             no
tab_bar_style                 powerline
scrollback_pager_history_size 10

map ctrl+shift+t launch --type=tab --cwd=current --copy-env
map ctrl+shift+s show_scrollback
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+alt+l   clear

include ./theme.conf
